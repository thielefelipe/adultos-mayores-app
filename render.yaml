services:
  - type: web
    name: adultos-mayores-backend
    env: node
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_Rk7hrmiHY8DU@ep-wispy-lake-aps48rn1.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        value: demo-secret-key-change-in-production
      - key: JWT_EXPIRE
        value: 24h
      - key: ENCRYPTION_KEY
        value: your_32_character_encryption_key_here
      - key: CORS_ORIGIN
        value: https://adultos-mayores-frontend.onrender.com,https://adultos-mayores-app.vercel.app

  - type: static_site
    name: adultos-mayores-frontend
    env: static
    region: ohio
    plan: free
    buildCommand: cd frontend && rm -rf node_modules dist && npm install && VITE_API_URL='https://adultos-mayores-backend.onrender.com/api' npm run build
    staticPublishPath: frontend/dist
