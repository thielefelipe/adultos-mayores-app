name: Keep Alive - Render Backend

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://adultos-mayores-backend.onrender.com/api)
          echo "✅ Backend ping - HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Servidor activo"
          else
            echo "⚠️ Respuesta inesperada: $STATUS"
          fi
